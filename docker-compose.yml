# The gateway, linked to the backend agent (Mirag).
#
# The agent runs from its own compose (agente-backend/docker-compose.prod.yml), which creates
# the `codezard_interna` network and publishes no port. The gateway joins that network and
# reaches the agent by name, http://mirag:8000. Start the agent first.
#
# Explicit project name: the agent's compose is project `codezard`, and this folder would get
# the same name, so each project would report the other's containers as orphans.
name: codezard-gateway

services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      GATEWAY_LOG_LEVEL: INFO
      # The token comes from .env, never from this file, and must equal the agent's MIRAG_TOKEN.
      # timeout_seconds is per wait for data, not per answer: the agent can spend a whole model
      # call (up to 60 s) between two events.
      GATEWAY_SERVICES: >-
        [
        {"name": "httpbin", "base_url": "http://httpbin:8080", "health_path": "/status/200"},
        {"name": "mirag", "base_url": "http://mirag:8000", "timeout_seconds": 180,
        "health_path": "/api/v1/health",
        "headers": {"X-Mirag-Token": "${MIRAG_TOKEN:?MIRAG_TOKEN is missing from .env}"}}
        ]
    networks: [default, interna]
    depends_on:
      - httpbin

  # Sample microservice to try the gateway with.
  httpbin:
    image: mccutchen/go-httpbin

networks:
  interna:
    external: true
    name: codezard_interna
