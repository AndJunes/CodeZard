[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway that acts as an intermediary between clients and microservices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Only two things in this gateway genuinely need Stellar's cryptography: verifying a sign-in
# signature, and reading what a signed x402 envelope actually pays. Everything else about
# billing — watching for a payment, quoting a price, submitting a transaction — is plain HTTP
# against Horizon with the client that is already here. So this is an extra, and a deployment
# without it keeps every other capability and says exactly which two it lacks.
# The 16.1 floor is `Keypair.verify_message`, SEP-53 message verification. Sign-in is not
# possible without it: browser wallets sign the SEP-53 hash rather than the message, so an
# older SDK can only check the raw bytes and refuses every genuine wallet.
stellar = ["stellar-sdk>=16.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gateway = "gateway.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["gateway"]
branch = true
omit = ["*/gateway/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# `stellar-sdk` is an optional extra and ships no stubs. A type check has to pass on a
# machine that does not have it installed — which is every machine where billing is off —
# and the two places that import it already handle its absence at runtime.
[[tool.mypy.overrides]]
module = ["stellar_sdk.*"]
ignore_missing_imports = true
